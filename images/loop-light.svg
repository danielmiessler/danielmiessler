<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 400" width="830" height="400" role="img" aria-label="One loop: from current state to ideal state, with LifeOS running it">
<defs><pattern id="rule" width="830" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H830" stroke="#DCD7CC" stroke-width="0.8"/></pattern>
<marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F574D"/></marker></defs>
<rect width="830" height="400" fill="#F0EEE8"/><rect width="830" height="400" fill="url(#rule)"/>
<g>
  <path d="M400 205A130 80 0 1 1 244 126.6" fill="none" stroke="#2A241D" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M140 205A130 80 0 1 1 296 283.4" fill="none" stroke="#2A241D" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M228 118.6l18 6-4 18" fill="none" stroke="#2A241D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 291.4l-18-6 4-18" fill="none" stroke="#2A241D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="205" r="6" fill="#35604F"/>
  <circle cx="400" cy="205" r="6" fill="#35604F"/>
</g>
<text x="270" y="217" text-anchor="middle" font-family="Charter" font-weight="bold" font-size="40" fill="#2A241D">LifeOS</text>
<text x="144" y="167" text-anchor="end" font-family="Charter" font-style="italic" font-size="19" fill="#2A241D">current state</text>
<text x="396" y="167" text-anchor="start" font-family="Charter" font-style="italic" font-size="19" fill="#2A241D">ideal state</text>
<!-- the verify wire, borrowed from the blueprint variant -->
<path d="M400 213V325H140V215" fill="none" stroke="#5F574D" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#v)"/>
<text x="270" y="347" text-anchor="middle" font-family="Fragment Mono" font-size="11" fill="#5F574D">verify against the ideal, then go again</text>
<g font-family="Charter" font-style="italic" font-size="16" fill="#5F574D">
  <text x="500" y="96">One loop: where you are, where you want</text>
  <text x="500" y="118">to be, and an AI harness that closes</text>
  <text x="500" y="140">the gap a verified pass at a time.</text>
  <text x="500" y="186"><tspan fill="#35604F">TELOS</tspan> is what you want, written down.</text>
  <text x="500" y="212"><tspan fill="#35604F">Human 3.0</tspan> is who you become.</text>
  <text x="500" y="258">Fabric, the idea sites, the writing:</text>
  <text x="500" y="280">what the loop has produced so far.</text>
</g>
<text x="790" y="376" text-anchor="end" font-family="Fragment Mono" font-size="11" fill="#5F574D">notebook, p.1</text>
</svg>