<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0F17"/>
      <stop offset="1" stop-color="#06080D"/>
    </linearGradient>
    <linearGradient id="trackG" gradientUnits="userSpaceOnUse" x1="72" y1="126" x2="808" y2="126">
      <stop offset="0" stop-color="#EA9F3D"/>
      <stop offset="0.5" stop-color="#C9CDD6"/>
      <stop offset="1" stop-color="#4597F7"/>
    </linearGradient>
    <clipPath id="plateclip2">
      <rect x="0" y="0" width="880" height="340" rx="10"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="339" rx="10" fill="url(#ground)" stroke="#232B3A" stroke-width="1"/>

  <g clip-path="url(#plateclip2)" opacity="0.25">
    <g stroke="#141A24" stroke-width="1" fill="none">
      <path d="M 700 300 H 800 V 250"/>
      <path d="M 760 330 V 285 H 850"/>
      <path d="M 40 40 H 120 V 80"/>
      <path d="M 80 20 V 55 H 170"/>
    </g>
    <g fill="#1B2434">
      <circle cx="800" cy="250" r="3"/>
      <circle cx="850" cy="285" r="3"/>
      <circle cx="120" cy="80" r="3"/>
      <circle cx="170" cy="55" r="3"/>
      <circle cx="40" cy="40" r="3"/>
      <circle cx="760" cy="330" r="3"/>
    </g>
  </g>

  <path d="M 72 126 H 808" stroke="url(#trackG)" stroke-width="2" opacity="0.55" fill="none"/>

  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 287 120 L 295 126 L 287 132"/>
    <path d="M 585 120 L 593 126 L 585 132"/>
  </g>

  <g>
    <circle cx="142" cy="126" r="13" fill="#080A11"/>
    <circle cx="142" cy="126" r="9" fill="#EA9F3D"/>
    <circle cx="142" cy="126" r="17" fill="none" stroke="#EA9F3D" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="440" cy="126" r="13" fill="#080A11"/>
    <circle cx="440" cy="126" r="9" fill="#FFFFFF"/>
    <circle cx="440" cy="126" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="738" cy="126" r="13" fill="#080A11"/>
    <circle cx="738" cy="126" r="9" fill="#4597F7"/>
    <circle cx="738" cy="126" r="17" fill="none" stroke="#4597F7" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <g text-anchor="middle">
    <text x="142" y="86" font-family="Menlo, SF Mono, monospace" font-size="12" letter-spacing="2.4" fill="#EA9F3D" fill-opacity="0.7">01</text>
    <text x="440" y="86" font-family="Menlo, SF Mono, monospace" font-size="12" letter-spacing="2.4" fill="#FFFFFF" fill-opacity="0.7">02</text>
    <text x="738" y="86" font-family="Menlo, SF Mono, monospace" font-size="12" letter-spacing="2.4" fill="#4597F7" fill-opacity="0.7">03</text>

    <text x="142" y="182" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="26" fill="#FFFFFF">TELOS</text>
    <text x="440" y="182" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="26" fill="#FFFFFF">LifeOS</text>
    <text x="738" y="182" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="26" fill="#FFFFFF">Human 3.0</text>

    <text x="142" y="208" font-family="Menlo, SF Mono, monospace" font-size="11" letter-spacing="1.76" fill="#EA9F3D">ARTICULATE</text>
    <text x="440" y="208" font-family="Menlo, SF Mono, monospace" font-size="11" letter-spacing="1.76" fill="#FFFFFF">RUN THE TRANSITION</text>
    <text x="738" y="208" font-family="Menlo, SF Mono, monospace" font-size="11" letter-spacing="1.76" fill="#4597F7">ARRIVE</text>

    <text x="142" y="238" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">Who you are, what you value,</text>
    <text x="142" y="260" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">and what you're actually</text>
    <text x="142" y="282" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">trying to achieve.</text>

    <text x="440" y="238" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">Capture that intent, convey it</text>
    <text x="440" y="260" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">to your AI every task, verify</text>
    <text x="440" y="282" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">the output against it.</text>

    <text x="738" y="238" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">You, defined by what you</text>
    <text x="738" y="260" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">create&#8212;with AI handling</text>
    <text x="738" y="282" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-size="15" fill="#A8AEBA">the routine work.</text>
  </g>
</svg>
